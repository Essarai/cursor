minimax:
  api_key: "your-minimax-api-key"
  base_url: "https://api.minimaxi.com/v1"
  # 海外用户可改为: https://api.minimax.io/v1
  model: "MiniMax-M3"
  temperature: 0.7

cscd:
  base_url: "http://sciencechina.cn/cscdboot/CscdService"
  user: "your-cscd-user"
  password: "your-cscd-password"
  timeout: 60
  search_articles_max_per_sec: 3

agent:
  system_prompt: prompts/system_prompt.md
  golden_cases: prompts/golden_cases.md
  recent_paper_years: 3
  temperature: 0.1
  json_mode: true
