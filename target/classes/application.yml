server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: smart-agri-api
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/smart_agri?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL5InnoDBDialect
    properties:
      hibernate:
        format_sql: true
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# JWT配置
jwt:
  secret: 8ba6ae21c1b54dc8a1da3e83b3f7ee43
  expiration: 86400000  # 24小时，单位：毫秒

# 日志配置
logging:
  level:
    root: info
    com.smartagri: debug
  file:
    name: logs/smart-agri-api.log 