<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSCD 审稿人推荐</title>
  <link rel="stylesheet" href="/styles.css?v=20260721r" />
</head>
<body>
  <div class="layout">
    <header class="header">
      <div class="header-inner">
        <div>
          <div class="header-title-row">
            <p class="eyebrow">CSCD</p>
            <h1>审稿人推荐Agent</h1>
          </div>
          <p class="subtitle">候选匹配 · AI 精荐</p>
        </div>
        <div class="status-pill" id="connectionStatus">
          <span class="dot"></span>
          <span>检测服务中…</span>
        </div>
      </div>
    </header>

    <main class="main">
      <section class="panel form-panel">
        <div class="form-panel-scroll">
          <h2>检索方式</h2>
          <div class="mode-switch" role="tablist" aria-label="检索方式">
            <button type="button" class="mode-tab active" data-mode="direct" id="modeDirectBtn">
              直接检索
            </button>
            <button type="button" class="mode-tab" data-mode="refine" id="modeRefineBtn">
              智能检索
            </button>
          </div>
          <p class="mode-hint" id="modeHint">填写关键词后直接开始检索</p>

          <form id="recommendForm" data-mode="direct">
            <label class="refine-only hidden">
              <span>论文标题 <em>*</em></span>
              <input
                type="text"
                name="title"
                placeholder="例如：四维Lorenz-like 系统的稳定性、分岔与混沌"
                value="四维Lorenz-like 系统的稳定性、分岔与混沌"
              />
            </label>

            <label class="refine-only hidden">
              <span>论文摘要</span>
              <textarea
                name="abstract"
                rows="5"
                placeholder="粘贴论文摘要，帮助提炼检索关键词"
              >为了解混沌现象的本质与发生机理，研究了一个四维Lorenz-like系统的动力学。首先，根据微分方程稳定性理论，研究了系统奇点及其稳定性。其次，研究了系统的分岔与混沌现象，数值模拟生动的揭示了系统由分岔通向混沌的道路。根据Lagrange稳定性理论系统全局指数吸引集的显式表达式。最后，为研究混沌系统在保密通信等领域中的应用，设计了新型的自适应同步方案实现了混沌的全局同步。</textarea>
            </label>

            <label class="field-keywords">
              <span id="keywordsLabel">检索关键词 <em>*</em></span>
              <input
                type="text"
                name="keywords"
                placeholder="逗号分隔，例如：混沌系统,同步控制"
                value="混沌系统,同步控制"
              />
              <small class="field-tip" id="keywordsTip">直接用于 CSCD 学者检索</small>
            </label>

            <label>
              <span>原作者机构</span>
              <input
                type="text"
                name="author_org"
                placeholder="选填，填写后触发 COI 机构熔断"
                value="浙江大学"
              />
            </label>

            <div class="form-actions">
              <button type="button" id="directSearchBtn" class="primary-btn">开始检索</button>
              <button type="button" id="refineBtn" class="primary-btn hidden">开始智能检索</button>
              <button type="button" id="stopBtn" class="secondary" disabled>停止</button>
            </div>
          </form>
        </div>

        <div class="refined-keywords-panel hidden" id="refinedKeywordsPanel">
          <button type="button" class="refined-keywords-head" id="refinedKeywordsToggle" aria-expanded="true">
            <span class="refined-keywords-title-row">
              <h3>提炼后关键词</h3>
              <span class="refined-keywords-used" id="refinedKeywordsUsed">用于检索</span>
            </span>
            <span class="refined-keywords-toggle-label" id="refinedKeywordsToggleLabel">收起</span>
          </button>
          <div class="refined-keywords-body" id="refinedKeywordsBody">
            <div class="kw-tags refined-kw-tags" id="refinedKeywordsTags"></div>
            <p class="refined-keywords-reasoning hidden" id="refinedKeywordsReasoning"></p>
          </div>
        </div>
      </section>

      <section class="panel output-panel">
        <div class="output-header">
          <h2>推荐过程</h2>
          <div class="stage-tabs" id="stageTabs">
            <button type="button" class="tab active" data-stage="all">全部</button>
            <button type="button" class="tab" data-stage="stage1">候选专家</button>
            <button type="button" class="tab" data-stage="stage2">背景补全</button>
            <button type="button" class="tab" data-stage="stage3">语义精筛</button>
            <button type="button" class="tab" data-stage="result">AI推荐结果</button>
          </div>
        </div>

        <div class="timeline" id="timeline">
          <article class="stage-card idle" data-stage="stage1">
            <div class="stage-head">
              <span class="stage-badge">1</span>
              <div>
                <h3>候选专家</h3>
                <p class="stage-desc">关键词召回 · 利益回避 · 相关度</p>
              </div>
              <span class="stage-state" id="stage1State">等待中</span>
            </div>
            <div class="stage-body" id="stage1Body">
              <p class="placeholder">提交后开始召回…</p>
            </div>
          </article>

          <article class="stage-card idle" data-stage="stage2">
            <div class="stage-head">
              <span class="stage-badge">2</span>
              <div>
                <h3>背景补全</h3>
                <p class="stage-desc">发文 · 活跃度</p>
              </div>
              <span class="stage-state" id="stage2State">等待中</span>
            </div>
            <div class="stage-body" id="stage2Body">
              <p class="placeholder">等待候选专家完成…</p>
            </div>
          </article>

          <article class="stage-card idle" data-stage="stage3">
            <div class="stage-head">
              <span class="stage-badge">3</span>
              <div>
                <h3>语义精筛</h3>
                <p class="stage-desc">模型推理</p>
              </div>
              <span class="stage-state" id="stage3State">等待中</span>
            </div>
            <div class="stage-body" id="stage3Body">
              <p class="placeholder">等待背景补全完成…</p>
            </div>
          </article>

          <article class="stage-card idle" data-stage="result">
            <div class="stage-head">
              <span class="stage-badge">✓</span>
              <div>
                <h3>AI推荐结果</h3>
                <p class="stage-desc">精选 3–5 位</p>
              </div>
              <span class="stage-state" id="resultState">等待中</span>
            </div>
            <div class="stage-body" id="resultBody">
              <p class="placeholder">精荐完成后展示…</p>
            </div>
          </article>
        </div>
      </section>
    </main>
  </div>

  <div class="modal-overlay hidden" id="pubsModal" role="dialog" aria-modal="true" aria-labelledby="pubsModalTitle">
    <div class="modal-panel">
      <div class="modal-header">
        <div>
          <h3 id="pubsModalTitle">历史发文统计</h3>
          <p class="modal-subtitle" id="pubsModalSubtitle"></p>
        </div>
        <button type="button" class="modal-close" id="pubsModalClose" aria-label="关闭">×</button>
      </div>
      <div class="modal-body" id="pubsModalBody">
        <p class="placeholder">加载中…</p>
      </div>
    </div>
  </div>

  <script src="/app.js?v=20260721r"></script>
</body>
</html>
